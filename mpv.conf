# ============================================
# NJ PLAYER 3.0 — CORE CONFIGURATION
# ============================================

# --- Performance ---
hwdec=auto-safe
vo=gpu
gpu-api=auto
gpu-context=auto
video-sync=display-resample
interpolation=yes
tscale=oversample
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
dither-depth=auto
temporal-dither=yes

# --- AV1 / 8K / next-gen codec support ---
# `auto-safe` already enables hardware decode where available; give AV1/8K a
# chance first and fall back smoothly instead of failing to decode.
hwdec-codecs=av1,h264,hevc,vc1,vp9
gpu-hwdec-interop=auto
vd-lavc-dr=yes
hr-seek=yes
vd-lavc-software-fallback=yes
vd-lavc-check-hw-decode=yes

# --- Playback ---
save-position-on-quit=yes
keep-open=no
osc=no
osd-bar=no
osd-font-size=18
osd-color='#00d4ff'
osd-border-color='#000000'
osd-duration=2000
volume-max=200
volume=100
mute=no
loop-file=no
loop-playlist=no
# Always allow resume even if the file was moved
watch-later-options=start

# --- Fallback for very heavy presets ---
# If a preset (e.g. Cinema/Restore) is too much for the GPU, the
# auto-enhance.lua script will drop to this profile to keep playback smooth.
[nj-fallback]
profile-desc="Stripped-down profile used when the GPU cannot keep up"
glsl-shaders=""
video-sync=audio
interpolation=no
temporal-dither=yes

# --- Subtitles ---
sub-auto=fuzzy
sub-font-size=48
sub-bold=yes
sub-color='#FFFFFF'
sub-border-color='#000000'

# --- Screenshots ---
screenshot-format=png
screenshot-png-compression=9
screenshot-directory=screenshots
screenshot-template='%F-%P-%n'

# --- Cache ---
cache=yes
cache-secs=120
demuxer-max-bytes=500MiB
demuxer-readahead-secs=120

# --- Audio ---
audio-channels=auto
audio-normalize-downmix=yes
af=acompressor=threshold=-20:ratio=3:attack=20:release=250

# --- Watch Later ---
watch-later-directory=watch_later

# --- Screenshot directory ---
screenshot-directory=screenshots

# --- Settings Manager ---
# Load the settings loader (stored in nj-config). It applies user
# preferences (default preset, audio profile, volume, etc.) on playback.
script=~~/nj-config/settings-loader.lua

# ============================================
# ENHANCEMENT PRESETS
# ============================================

# --- Preset 0: Off ---
[nj-off]
profile-desc="Clean playback, no enhancement"
glsl-shaders=""

# --- Preset 1: Lucid (Adaptive Sharpening) ---
[nj-lucid]
profile-desc="Smart adaptive sharpening"
glsl-shaders="shaders/adaptive-sharpen.glsl"

# --- Preset 2: Cinema (Full Pipeline) ---
[nj-cinema]
profile-desc="Complete restoration for low-res video"
glsl-shaders="shaders/krigbilateral.glsl;shaders/ssimsuperres.glsl;shaders/ravu-z-ar-r3.glsl;shaders/adaptive-sharpen.glsl"

# --- Preset 3: Anime (Anime4K) ---
[nj-anime]
profile-desc="Anime4K restoration for 2D content"
glsl-shaders="shaders/anime4k-restore-cnn-soft.glsl;shaders/anime4k-artcnn-x2.glsl;shaders/anime4k-clamp-highlights.glsl"

# --- Preset 4: HDR Tone Mapping ---
[nj-hdr]
profile-desc="HDR to SDR tone mapping (uses mpv built-in)"
target-peak=100
tone-mapping=auto
tone-mapping-param=1.0
hdr-compute-peak=yes

# --- Preset 5: Denoise ---
[nj-denoise]
profile-desc="Noise removal"
glsl-shaders="shaders/nlmeans-luma.glsl;shaders/adaptive-sharpen.glsl"

# --- Preset 6: Motion Interpolation ---
[nj-motion]
profile-desc="Smooth motion for sports and action"
interpolation=yes
tscale=oversample
video-sync=display-resample

# --- Preset 7: Auto Detection ---
[nj-auto]
profile-desc="Smart content detection"
glsl-shaders="shaders/krigbilateral.glsl;shaders/adaptive-sharpen.glsl"
# Auto-enhancement script handles dynamic switching

# --- Preset 8: Compare Mode ---
[nj-compare]
profile-desc="Split-screen comparison (use Ctrl+8 in player)"
# Compare mode is handled by compare-mode.lua script

# --- Preset 9: Restore (Aggressive) ---
[nj-restore]
profile-desc="Full restoration for severely degraded video"
glsl-shaders="shaders/krigbilateral.glsl;shaders/ssimsuperres.glsl;shaders/ravu-z-ar-r3.glsl;shaders/nlmeans-luma.glsl;shaders/adaptive-sharpen.glsl"
