# ============================================
# NJ PLAYER 3.0 — KEY BINDINGS
# ============================================

# --- Enhancement Presets ---
CTRL+0  script-message nj-preset off
CTRL+1  script-message nj-preset lucid
CTRL+2  script-message nj-preset cinema
CTRL+3  script-message nj-preset anime
CTRL+4  script-message nj-preset hdr
CTRL+5  script-message nj-preset denoise
CTRL+6  script-message nj-preset motion
CTRL+7  script-message nj-preset auto
CTRL+8  script-message nj-preset compare
CTRL+9  script-message nj-preset restore
F9      script-message nj-cycle

# --- Audio Enhancement ---
CTRL+SHIFT+A  script-message nj-audio-toggle
CTRL+SHIFT+D  script-message nj-dialogue-boost
CTRL+SHIFT+N  script-message nj-noise-reduction
CTRL+SHIFT+V  script-message nj-volume-normalize
CTRL+SHIFT+B  script-message nj-bass-restore
CTRL+SHIFT+W  script-message nj-stereo-widen
CTRL+SHIFT+M  script-message nj-night-mode

# --- Video Controls ---
z       script-message nj-zoom
ALT+UP  script-message nj-zoom-in
ALT+DOWN script-message nj-zoom-out
ALT+0   script-message nj-zoom-reset
CTRL+LEFT  script-message nj-pan-left
CTRL+RIGHT script-message nj-pan-right
CTRL+UP    script-message nj-pan-up
CTRL+DOWN  script-message nj-pan-down
c       script-message nj-crop
r       script-message nj-rotate
h       script-message nj-flip-h
,       frame-back-step
.       frame-step
s       screenshot
l       script-message nj-ab-loop
# Audio-video sync (adds/subtracts a delay to fix out-of-sync files)
ALT+CTRL+DOWN  add audio-delay -0.05
ALT+CTRL+UP    add audio-delay 0.05
CTRL+SHIFT+UP  set audio-delay 0
# Cycle hardware decoding (troubleshooting)
CTRL+h  cycle hwdec
# Cycle window fullscreen (extra)
F       cycle fullscreen

# --- Security ---
CTRL+E  script-message nj-encrypt
CTRL+D  script-message nj-decrypt-play
CTRL+SHIFT+DEL  script-message nj-secure-delete
CTRL+L  script-message nj-lock

# --- Navigation ---
SPACE   cycle pause
LEFT    seek -5
RIGHT   seek 5
UP      seek 60
DOWN    seek -60
[       multiply speed 0.5
]       multiply speed 2.0
f       cycle fullscreen
m       cycle mute
TAB     script-binding stats/display-stats-toggle
SHIFT+H script-message nj-help
CTRL+SHIFT+P script-message nj-perf-monitor

# --- Zoom ---
CTRL+BS script-message nj-clear-resume
